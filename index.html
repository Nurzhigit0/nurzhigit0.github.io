<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нуржигит Абдуалимов · Financial Manager</title>
<meta name="description" content="Нуржигит — Financial Manager, Ташкент. Контакты и реквизиты.">
<meta name="theme-color" content="#151515">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Dark Premium: графитовый фон, золото как единственный акцент, слоновая кость для текста.
     Layout: одна узкая колонка, контакты — в первые 3 секунды, реквизиты — по нажатию. */
  --bg:#151515;
  --surface:#222120;
  --line:#2e2b26;
  --gold:#D8B77A;
  --ivory:#F4F0E8;
  --muted:#9c968b;
  --display:"Manrope", "Helvetica Neue", Arial, sans-serif;
  --body:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100%;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

.wrap{max-width:440px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:28px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center}
.mono{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--gold)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 10px;border-radius:999px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#151515}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:6px}
.avatar{
  width:132px;height:132px;border-radius:50%;
  border:1.5px solid var(--gold);padding:5px;
}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar div{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, #2b2924, #191816 70%);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:40px;color:var(--gold);letter-spacing:.02em;
}
.name{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
.role{font-family:var(--display);font-weight:500;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.city{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-style:italic;color:var(--gold);opacity:.85;letter-spacing:.02em}
.rule{width:48px;height:1px;background:var(--gold);opacity:.6}

/* primary */
.save{
  width:100%;display:flex;justify-content:center;align-items:center;gap:10px;
  background:var(--gold);color:#151515;font-weight:700;font-size:16px;
  padding:16px;border-radius:14px;letter-spacing:.02em;
}
.save:active{transform:scale(.99)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-12px}
.quick a{
  aspect-ratio:1;border:1px solid var(--line);border-radius:14px;
  display:grid;place-items:center;background:var(--surface);
}
.quick svg{width:22px;height:22px;stroke:var(--ivory);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* sections */
section{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.about{font-size:16px;color:var(--ivory)}
.stat{display:flex;align-items:baseline;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stat b{font-family:var(--display);font-size:28px;color:var(--gold);font-weight:600}
.stat span{font-size:14px;color:var(--muted)}

.services{list-style:none;display:flex;flex-direction:column}
.services li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.services li:last-child{border-bottom:0}
.services i{font-style:normal;font-family:var(--display);font-size:11px;color:var(--gold);letter-spacing:.08em;min-width:20px;font-variant-numeric:tabular-nums}

.list{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.row .ic svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.row .lb{font-size:12px;color:var(--muted)}
.row .vl{font-size:15px;font-weight:600;overflow-wrap:break-word;word-break:break-word}
.row .go{color:var(--muted);font-size:18px}

.copy{
  flex:none;font-size:12.5px;font-weight:600;color:var(--gold);
  border:1px solid rgba(216,183,122,.4);padding:7px 12px;border-radius:999px;
}
.copy.ok{background:var(--gold);color:#151515;border-color:var(--gold)}

/* payment */
details.pay{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
details.pay summary{
  list-style:none;display:flex;justify-content:space-between;align-items:center;
  padding:16px;cursor:pointer;font-weight:600;font-size:15.5px;
}
details.pay summary::-webkit-details-marker{display:none}
details.pay summary .chev{transition:transform .2s;color:var(--gold)}
details.pay[open] summary .chev{transform:rotate(180deg)}
.cards{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.bank{
  border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(135deg,#26231e,#1a1917);border:1px solid rgba(216,183,122,.25);
}
.bank .bn{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:var(--display);font-weight:600}
.bank .num{white-space:nowrap;font-size:clamp(17px,5.2vw,21px);font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.bank .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.copy.big{width:100%;padding:13px;font-size:15px;background:var(--gold);color:#151515;border-color:var(--gold);border-radius:12px}
.copy.big.ok{background:var(--ivory);border-color:var(--ivory)}
.bank .holder{font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

.share{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:14px;border:1px solid rgba(216,183,122,.45);border-radius:14px;color:var(--gold);font-weight:600;font-size:15px}
footer{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.06em;padding-top:4px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--ivory);color:#151515;font-weight:600;font-size:14px;
  padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:no-preference){
  .hero,.save,.quick,section{animation:rise .5s ease both}
  .save{animation-delay:.05s}.quick{animation-delay:.1s}
  section:nth-of-type(1){animation-delay:.15s}section:nth-of-type(2){animation-delay:.2s}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const t = T[lang], L = links();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const k = el.dataset.t;
    el.textContent = k === "name" ? DATA.firstName[lang] + " " + DATA.lastName[lang] : t[k];
  });

  $("#quick").innerHTML = ["tg","ph","ig","em"].map(k =>

  $("#services").innerHTML = t.services.map((s,i) =>

  $("#contacts").innerHTML = ["ph","tg","ig","em"].map(k => {

function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch(_) { return false; }
  }
}

document.addEventListener("click", async e => {
  const lb = e.target.closest(".langs button");
  if (lb){ lang = lb.dataset.lang; try{localStorage.setItem("nurik-lang",lang)}catch(_){} render(); return; }
  const cb = e.target.closest("[data-copy]");
  if (cb){
    const ok = await copyText(cb.dataset.copy);
    if (ok){ cb.classList.add("ok"); cb.textContent = T[lang].copied; toast(T[lang].copied);
      setTimeout(() => { cb.classList.remove("ok"); cb.textContent = cb.dataset.label || T[lang].copy; }, 1500); }
    else toast(cb.dataset.copy);
  }
});

let downloads = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
}

$("#saveBtn").addEventListener("click", async () => {
  const text = vcard(), filename = "Nurzhigit_Abdualimov.vcf";
  if (downloads) {
    try { await downloads.save({ filename, data: new Blob([text], { type: "text/vcard" }) }); return; }
    catch(e){ /* fall through */ }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "text/vcard;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast(T[lang].saveFail); }
});

$("#shareBtn").addEventListener("click", async () => {
  const url = location.href.split("#")[0];
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  if (await copyText(url)) toast(T[lang].linkCopied);
});

render();
</script>
</body>
</html>
